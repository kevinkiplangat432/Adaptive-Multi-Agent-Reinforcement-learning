<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARVIS — AI Ecosystem Simulation</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#080c11;color:#dbe5ea;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #app{position:relative;width:100vw;height:100vh}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #hud,#legend,#controls{
    position:absolute;background:rgba(12,17,23,.86);border:1px solid rgba(255,255,255,.09);
    box-shadow:0 12px 40px rgba(0,0,0,.22);backdrop-filter:blur(8px);border-radius:12px
  }
  #hud{top:14px;left:14px;width:255px;padding:14px}
  #hud h1{font-size:14px;margin:0 0 10px;color:#fff}
  .sub{font-size:10px;color:#71808a;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;margin:5px 0;font-size:11px}
  .row span:first-child{color:#788993}.row span:last-child{color:#eef4f6;font-weight:600}
  #status{margin-top:10px;padding:8px;border-radius:8px;background:rgba(75,209,142,.08);color:#72e1aa;font-size:10px}
  #legend{top:14px;right:14px;padding:10px 13px;width:145px}
  .legend-item{display:flex;align-items:center;gap:7px;margin:5px 0;font-size:10px;color:#93a2aa}
  .dot{width:8px;height:8px;border-radius:50%}
  #controls{left:14px;bottom:14px;padding:9px;display:flex;gap:7px;align-items:center}
  button{
    border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);color:#e6edf0;
    border-radius:8px;padding:8px 11px;font-size:11px;cursor:pointer
  }
  button:hover{background:rgba(255,255,255,.11)}
  button.active{border-color:rgba(75,209,142,.45);background:rgba(75,209,142,.12);color:#72e1aa}
  #hint{position:absolute;right:14px;bottom:14px;font-size:10px;color:#66757f}
</style>
</head>
<body>
<div id="app">
  <canvas id="graph"></canvas>

  <div id="hud">
    <h1>ARVIS ecosystem simulation</h1>
    <div class="sub">Synthetic temporal AI interaction graph</div>
    <div class="row"><span>Entities</span><span id="nodes">0</span></div>
    <div class="row"><span>Interactions</span><span id="edges">0</span></div>
    <div class="row"><span>Events</span><span id="events">0</span></div>
    <div class="row"><span>Security events</span><span id="alerts">0</span></div>
    <div class="row"><span>Visible edges</span><span id="visible">0</span></div>
    <div class="row"><span>Last risk</span><span id="risk">—</span></div>
    <div class="row"><span>Generation</span><span id="generation">0</span></div>
    <div id="status">Ready — generate an ecosystem</div>
  </div>

  <div id="legend"></div>

  <div id="controls">
    <button id="generate">Generate 100k edges</button>
    <button id="interaction">Simulate interaction</button>
    <button id="auto">Auto-run</button>
    <button id="reset">Reset</button>
  </div>

  <div id="hint">Drag nodes • mouse wheel to zoom</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
/*
  ARVIS AI ECOSYSTEM SIMULATION

  Important design change:
  - Nodes are entities/components in the ecosystem.
  - Edges are actual interactions/events between entities.
  - Edges carry semantic attributes.
  - 100k+ edges can exist in the graph.
  - Canvas is used instead of SVG so we don't create 100k DOM elements.
  - Only a sampled subset of edges is rendered.
*/

const TYPES = {
  user:     {label:"User",      color:"#9b8cf0"},
  agent:    {label:"AI Agent",  color:"#4a9ff0"},
  model:    {label:"Model",      color:"#61a5ff"},
  prompt:   {label:"Prompt",    color:"#6fd3c7"},
  tool:     {label:"Tool",      color:"#3fbf8f"},
  memory:   {label:"Memory",    color:"#e07bb0"},
  database: {label:"Database",  color:"#8fc94a"},
  api:      {label:"API",       color:"#8a9df0"},
  policy:   {label:"Policy",    color:"#f0a94a"},
  security: {label:"Security",  color:"#ff5c5c"}
};

const RELATIONS = [
  "prompt","invokes","reads","writes","calls","uses",
  "retrieves","stores","governed_by","responds_to","delegates"
];

const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");
let W = innerWidth, H = innerHeight, dpr = devicePixelRatio || 1;

function resize(){
  W = innerWidth; H = innerHeight; dpr = devicePixelRatio || 1;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+"px"; canvas.style.height = H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", resize); resize();

let nodes = [];
let edges = [];
let visibleEdges = [];
let eventCounter = 0;
let alertCounter = 0;
let generation = 0;
let nextNodeId = 0;
let running = false;
let autoTimer = null;

const MAX_EDGES = 100000;
const DISPLAY_EDGE_LIMIT = 8500;
const DISPLAY_NODE_LIMIT = 2600;

const nodeMap = new Map();

function rand(a,b){ return a + Math.random()*(b-a); }
function pick(a){ return a[(Math.random()*a.length)|0]; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

function makeNode(type, cluster=0){
  const n = {
    id: "n"+(nextNodeId++),
    type,
    cluster,
    x: W/2 + rand(-120,120),
    y: H/2 + rand(-100,100),
    vx: 0, vy: 0,
    activity: 0,
    birth: performance.now()
  };
  nodes.push(n);
  nodeMap.set(n.id,n);
  return n;
}

function addEdge(source,target,relation,extra={}){
  if(edges.length >= MAX_EDGES) return;
  edges.push({
    id: "e"+edges.length,
    source: source.id,
    target: target.id,
    relation,
    timestamp: Date.now(),
    latency: Math.round(rand(15,250)),
    tokens: Math.round(rand(20,1800)),
    success: Math.random() > .025,
    risk: extra.risk ?? Math.random()*0.25,
    alert: !!extra.alert
  });
  source.activity++;
  target.activity++;
}

function createEcosystem(){
  nodes=[]; edges=[]; nodeMap.clear();
  eventCounter=0; alertCounter=0; generation++;
  nextNodeId=0;

  /*
    We create an ecosystem of entities first.
    These are NOT "events".
    They are persistent components that can participate in events.
  */

  const users = [];
  const agents = [];
  const models = [];
  const tools = [];
  const memories = [];
  const databases = [];
  const apis = [];
  const policies = [];

  for(let i=0;i<180;i++) users.push(makeNode("user", i%12));
  for(let i=0;i<320;i++) agents.push(makeNode("agent", i%24));
  for(let i=0;i<180;i++) models.push(makeNode("model", i%24));
  for(let i=0;i<260;i++) tools.push(makeNode("tool", i%30));
  for(let i=220;i<400;i++) memories.push(makeNode("memory", i%30));
  for(let i=0;i<220;i++) databases.push(makeNode("database", i%28));
  for(let i=0;i<180;i++) apis.push(makeNode("api", i%24));
  for(let i=0;i<120;i++) policies.push(makeNode("policy", i%20));

  /*
    Baseline structural relationships.
  */
  agents.forEach(agent => {
    addEdge(pick(users),agent,"prompt");
    addEdge(agent,pick(models),"calls");
    addEdge(agent,pick(policies),"governed_by");
    addEdge(agent,pick(memories),"retrieves");
  });

  /*
    Generate temporal interaction events until we reach 100k edges.
    Each event is a small workflow:
       user -> agent -> model -> tool -> database/API/memory
  */
  while(edges.length < MAX_EDGES){
    const agent = pick(agents);
    const user = pick(users);
    const model = pick(models);
    const tool = pick(tools);

    addEdge(user,agent,"prompt");
    addEdge(agent,model,"calls");
    addEdge(agent,tool,"invokes");

    const branch = Math.random();

    if(branch < .42){
      addEdge(tool,pick(databases),"reads");
      addEdge(tool,pick(databases),"writes");
    }else if(branch < .68){
      addEdge(tool,pick(apis),"calls");
      addEdge(pick(apis),agent,"responds_to");
    }else{
      addEdge(tool,pick(memories),"stores");
      addEdge(agent,pick(memories),"retrieves");
    }

    /*
      Rare synthetic anomaly:
      unusual chain crossing clusters / components.
    */
    if(Math.random() < .012 && edges.length < MAX_EDGES){
      const suspiciousTarget = pick(databases);
      addEdge(agent,suspiciousTarget,"reads",{
        risk: rand(.78,.99),
        alert:true
      });
      alertCounter++;
    }

    eventCounter++;
  }

  /*
    We don't run D3 physics on 100k edges.
    The entire graph exists, but visualization uses a representative
    subset. This is essential for browser performance.
  */
  buildDisplaySubset();

  updateHud();
  setStatus("100,000 interactions generated — full graph in memory");
}

function buildDisplaySubset(){
  visibleEdges=[];

  /*
    Prefer high-risk edges and recent edges.
    Then fill remaining display capacity randomly.
  */
  const important = edges.filter(e=>e.alert || e.risk>.7);
  const chosen = new Set();

  important.forEach(e=>{
    if(chosen.size < DISPLAY_EDGE_LIMIT){
      chosen.add(e.id); visibleEdges.push(e);
    }
  });

  const stride = Math.max(1,Math.floor(edges.length / DISPLAY_EDGE_LIMIT));

  for(let i=0;visibleEdges.length<DISPLAY_EDGE_LIMIT && i<edges.length;i+=stride){
    const e=edges[i];
    if(!chosen.has(e.id)){
      chosen.add(e.id);
      visibleEdges.push(e);
    }
  }

  /*
    Nodes appearing in visible edges plus the most active entities.
  */
  const active = [...nodes]
    .sort((a,b)=>b.activity-a.activity)
    .slice(0,DISPLAY_NODE_LIMIT);

  const displaySet = new Set(active.map(n=>n.id));
  visibleEdges.forEach(e=>{
    displaySet.add(e.source);
    displaySet.add(e.target);
  });

  /*
    Give each node a cluster-based initial position.
    This makes the ecosystem readable without a giant force simulation.
  */
  nodes.forEach(n=>{
    const angle = (n.cluster * .75) + (n.id.length * .1);
    const radius = 150 + (n.cluster%9)*45;
    if(!n._placed){
      n.x = W/2 + Math.cos(angle)*radius + rand(-80,80);
      n.y = H/2 + Math.sin(angle)*radius + rand(-80,80);
      n._placed=true;
    }
  });
}

function simulateInteraction(){
  if(!nodes.length) createEcosystem();

  const agents=nodes.filter(n=>n.type==="agent");
  const users=nodes.filter(n=>n.type==="user");
  const tools=nodes.filter(n=>n.type==="tool");
  const dbs=nodes.filter(n=>n.type==="database");
  const memories=nodes.filter(n=>n.type==="memory");
  const apis=nodes.filter(n=>n.type==="api");
  const models=nodes.filter(n=>n.type==="model");

  if(edges.length+10 >= MAX_EDGES){
    setStatus("100k edge capacity reached — generating live events by replacing display sample");
    return;
  }

  const agent=pick(agents);
  const user=pick(users);
  const model=pick(models);
  const tool=pick(tools);

  addEdge(user,agent,"prompt");
  addEdge(agent,model,"calls");
  addEdge(agent,tool,"invokes");

  let risk=Math.random();

  if(risk<.45){
    addEdge(tool,pick(dbs),"reads",{risk:risk});
    addEdge(tool,pick(memories),"retrieves",{risk:risk});
  }else if(risk<.8){
    addEdge(tool,pick(apis),"calls",{risk:risk});
  }else{
    const suspicious = pick(dbs);
    addEdge(agent,suspicious,"reads",{risk:risk,alert:true});
    alertCounter++;
  }

  eventCounter++;
  generation++;
  buildDisplaySubset();
  updateHud();
  setStatus("Live interaction observed");
}

function reset(){
  nodes=[];edges=[];visibleEdges=[];
  nodeMap.clear();
  eventCounter=0;alertCounter=0;generation=0;nextNodeId=0;
  stopAuto();
  updateHud();
  setStatus("Reset — graph is empty");
}

function startAuto(){
  if(autoTimer)return;
  running=true;
  document.getElementById("auto").classList.add("active");
  autoTimer=setInterval(()=>{
    for(let i=0;i<3;i++)simulateInteraction();
  },650);
}

function stopAuto(){
  running=false;
  if(autoTimer)clearInterval(autoTimer);
  autoTimer=null;
  document.getElementById("auto").classList.remove("active");
}

function updateHud(){
  document.getElementById("nodes").textContent=nodes.length.toLocaleString();
  document.getElementById("edges").textContent=edges.length.toLocaleString();
  document.getElementById("events").textContent=eventCounter.toLocaleString();
  document.getElementById("alerts").textContent=alertCounter.toLocaleString();
  document.getElementById("visible").textContent=visibleEdges.length.toLocaleString();
  const recent=edges.length?edges[edges.length-1].risk:null;
  document.getElementById("risk").textContent=recent==null?"—":Math.round(recent*100)+"/100";
  document.getElementById("generation").textContent=generation.toLocaleString();
}

function setStatus(text){
  document.getElementById("status").textContent=text;
}

/* ---------- lightweight visual physics ---------- */

let zoom=1, panX=0, panY=0;
let dragging=null;

canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  zoom=clamp(zoom*(e.deltaY<0?1.08:.92),.35,3);
},{passive:false});

canvas.addEventListener("mousedown",e=>{
  const p=screenToWorld(e.clientX,e.clientY);
  let closest=null,dist=18/zoom;

  for(const n of nodes){
    if(n.type==="security")continue;
    const d=Math.hypot(n.x-p.x,n.y-p.y);
    if(d<dist){dist=d;closest=n;}
  }
  if(closest)dragging=closest;
});

addEventListener("mousemove",e=>{
  if(!dragging)return;
  const p=screenToWorld(e.clientX,e.clientY);
  dragging.x=p.x; dragging.y=p.y;
});

addEventListener("mouseup",()=>dragging=null);

function screenToWorld(x,y){
  return {
    x:(x-W/2-panX)/zoom+W/2,
    y:(y-H/2-panY)/zoom+H/2
  };
}

function stepVisualPhysics(){
  /*
    Only the displayed nodes receive local relaxation.
    The 100k-edge graph itself remains independent from visualization.
  */
  const displayedIds=new Set();
  visibleEdges.forEach(e=>{
    displayedIds.add(e.source);displayedIds.add(e.target);
  });

  const displayNodes=nodes.filter(n=>displayedIds.has(n.id));

  for(const n of displayNodes){
    let fx=(W/2-n.x)*0.0007;
    let fy=(H/2-n.y)*0.0007;

    for(const m of displayNodes){
      if(n===m)continue;
      const dx=n.x-m.x,dy=n.y-m.y;
      const d2=dx*dx+dy*dy+80;
      if(d2<25000){
        const f=16/d2;
        fx += dx*f;
        fy += dy*f;
      }
    }

    n.vx=(n.vx+fx)*.91;
    n.vy=(n.vy+fy)*.91;
    n.x+=n.vx;
    n.y+=n.vy;

    const margin=35;
    n.x=clamp(n.x,margin,W-margin);
    n.y=clamp(n.y,margin,H-margin);
  }
}

/* ---------- renderer ---------- */

function draw(){
  ctx.clearRect(0,0,W,H);

  ctx.save();
  ctx.translate(W/2+panX,H/2+panY);
  ctx.scale(zoom,zoom);
  ctx.translate(-W/2,-H/2);

  const now=performance.now();

  /*
    Edges are rendered as a sample, not as DOM objects.
    100k edges still exist in `edges`.
  */
  for(const e of visibleEdges){
    const s=nodeMap.get(e.source), t=nodeMap.get(e.target);
    if(!s||!t)continue;

    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(t.x,t.y);

    if(e.alert){
      ctx.strokeStyle="rgba(255,75,75,.85)";
      ctx.lineWidth=1.7;
    }else{
      ctx.strokeStyle="rgba(160,180,195,.11)";
      ctx.lineWidth=.7;
    }

    ctx.stroke();
  }

  /*
    Draw only active/display nodes.
  */
  const visibleNodeIds=new Set();
  visibleEdges.forEach(e=>{
    visibleNodeIds.add(e.source);
    visibleNodeIds.add(e.target);
  });

  for(const n of nodes){
    if(!visibleNodeIds.has(n.id))continue;

    const r=n.type==="security"?6:n.type==="agent"?5:3.5;
    const c=TYPES[n.type].color;

    if(n.type==="security"){
      ctx.beginPath();
      ctx.arc(n.x,n.y,11+Math.sin(now/120)*3,0,Math.PI*2);
      ctx.strokeStyle="rgba(255,92,92,.25)";
      ctx.lineWidth=2;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fillStyle=c;
    ctx.fill();

    if(n.type==="agent"){
      ctx.beginPath();
      ctx.arc(n.x,n.y,r+3,0,Math.PI*2);
      ctx.strokeStyle="rgba(74,159,240,.18)";
      ctx.stroke();
    }
  }

  ctx.restore();

  stepVisualPhysics();
  requestAnimationFrame(draw);
}

/* ---------- legend ---------- */

const legend=document.getElementById("legend");
for(const [key,v] of Object.entries(TYPES)){
  legend.insertAdjacentHTML("beforeend",
    `<div class="legend-item"><span class="dot" style="background:${v.color}"></span>${v.label}</div>`
  );
}

/* ---------- controls ---------- */

document.getElementById("generate").onclick=()=>{
  stopAuto();
  setStatus("Generating 100,000 interactions...");
  requestAnimationFrame(()=>createEcosystem());
};

document.getElementById("interaction").onclick=simulateInteraction;

document.getElementById("auto").onclick=()=>{
  running?stopAuto():startAuto();
};

document.getElementById("reset").onclick=reset;

updateHud();
draw();
</script>
</body>
</html>
