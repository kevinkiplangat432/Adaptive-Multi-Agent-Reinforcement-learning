<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ARVIS Graph Simulation</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0f14; overflow: hidden; height: 100%; }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  svg { width: 100%; height: 100%; display: block; }

  .link { stroke-width: 1.4px; stroke-linecap: round; }
  .link.flow { stroke-dasharray: 4 4; animation: dash 1s linear infinite; }
  .link.alert { stroke: #ff4d4d !important; stroke-width: 2.5px; }
  @keyframes dash { to { stroke-dashoffset: -16; } }

  .node circle { stroke: rgba(255,255,255,0.35); stroke-width: 1px; cursor: pointer; }
  .node circle.pulse { animation: pulse 0.7s ease-out; }
  @keyframes pulse {
    0% { r: 8; opacity: 1; }
    100% { r: 26; opacity: 0; }
  }
  .node text {
    fill: #cfd8dc; font-size: 10px; text-anchor: middle; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }

  #hud {
    position: absolute; top: 16px; left: 16px; color: #cfd8dc; font-size: 12px;
    background: rgba(15,20,26,0.75); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 12px 16px; backdrop-filter: blur(4px);
    max-width: 230px;
  }
  #hud h1 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: #fff; letter-spacing: 0.3px; }
  #hud .row { display: flex; justify-content: space-between; margin: 2px 0; color: #8ea0ab; }
  #hud .row span:last-child { color: #e6edf0; font-weight: 500; }
  #hud #risk.high { color: #ff6b6b; font-weight: 600; }
  #hud #risk.med { color: #f5b942; font-weight: 600; }
  #hud #risk.low { color: #4bd18e; font-weight: 600; }

  #controls {
    position: absolute; bottom: 16px; left: 16px; display: flex; gap: 8px; align-items: center;
  }
  button {
    background: rgba(255,255,255,0.06); color: #e6edf0; border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: background 0.15s;
  }
  button:hover { background: rgba(255,255,255,0.14); }
  button.active { background: rgba(75,209,142,0.2); border-color: rgba(75,209,142,0.5); color: #4bd18e; }

  #legend {
    position: absolute; top: 16px; right: 16px; background: rgba(15,20,26,0.75);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 14px;
    font-size: 11px; color: #8ea0ab; backdrop-filter: blur(4px);
  }
  #legend .item { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="svg"></svg>
  <div id="hud">
    <h1>ARVIS live graph</h1>
    <div class="row"><span>Nodes</span><span id="nodeCount">0</span></div>
    <div class="row"><span>Edges</span><span id="edgeCount">0</span></div>
    <div class="row"><span>Events</span><span id="eventCount">0</span></div>
    <div class="row"><span>Last risk</span><span id="risk">—</span></div>
  </div>
  <div id="legend"></div>
  <div id="controls">
    <button id="simBtn">Simulate interaction</button>
    <button id="autoBtn">Auto-run</button>
    <button id="resetBtn">Reset</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const TYPES = {
  user:       { color: '#9b8cf0', label: 'User' },
  agent:      { color: '#4a9ff0', label: 'AI agent' },
  prompt:     { color: '#6fd3c7', label: 'Prompt' },
  tool:       { color: '#3fbf8f', label: 'Tool' },
  memory:     { color: '#e07bb0', label: 'Memory' },
  database:   { color: '#8fc94a', label: 'Database' },
  policy:     { color: '#f0a94a', label: 'Policy' },
  security_event: { color: '#ff5c5c', label: 'Security event' }
};

const ANCHOR_TYPES = new Set(['user', 'agent']); // never pruned

const svg = d3.select('#svg');
const width = () => window.innerWidth, height = () => window.innerHeight;

svg.append('defs').append('marker')
  .attr('id', 'arrow').attr('viewBox', '0 0 10 10').attr('refX', 18).attr('refY', 5)
  .attr('markerWidth', 5).attr('markerHeight', 5).attr('orient', 'auto-start-reverse')
  .append('path').attr('d', 'M0 0L10 5L0 10Z').attr('fill', 'rgba(255,255,255,0.35)');

const linkLayer = svg.append('g');
const nodeLayer = svg.append('g');

let nodes = [], links = [], nodeCounter = 0, eventCounter = 0;
const MAX_NODES = 26;

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(90).strength(0.7))
  .force('charge', d3.forceManyBody().strength(-260))
  .force('center', d3.forceCenter(width() / 2, height() / 2))
  .force('collide', d3.forceCollide(30))
  .on('tick', ticked);

function addNode(type, x, y) {
  const n = { id: 'n' + (nodeCounter++), type, x: x ?? width()/2 + (Math.random()-0.5)*40, y: y ?? height()/2 + (Math.random()-0.5)*40 };
  nodes.push(n);
  return n;
}
function addLink(source, target, alert) {
  links.push({ source: source.id, target: target.id, alert: !!alert });
}

// FIX: only prune ephemeral nodes — never remove the user/agent anchors,
// since links keep referencing agent.id/user.id on every interaction.
function pruneIfNeeded() {
  while (nodes.length > MAX_NODES) {
    const idx = nodes.findIndex(n => !ANCHOR_TYPES.has(n.type));
    if (idx === -1) break; // nothing safe left to prune
    const removeId = nodes[idx].id;
    nodes.splice(idx, 1);
    links = links.filter(l => (l.source.id ?? l.source) !== removeId && (l.target.id ?? l.target) !== removeId);
  }
}

function restart() {
  sim.nodes(nodes);
  sim.force('link').links(links);
  sim.alpha(0.9).restart();
  render();
  updateHud();
}

function render() {
  const link = linkLayer.selectAll('line').data(links, d => (d.source.id ?? d.source) + '-' + (d.target.id ?? d.target));
  link.exit().remove();
  const linkEnter = link.enter().append('line')
    .attr('class', d => 'link flow' + (d.alert ? ' alert' : ''))
    .attr('stroke', d => d.alert ? '#ff4d4d' : 'rgba(255,255,255,0.25)')
    .attr('marker-end', 'url(#arrow)');

  const node = nodeLayer.selectAll('g.node').data(nodes, d => d.id);
  node.exit().remove();
  const nodeEnter = node.enter().append('g').attr('class', 'node')
    .call(d3.drag().on('start', dragstart).on('drag', dragged).on('end', dragend));

  nodeEnter.append('circle')
    .attr('r', 0)
    .attr('fill', d => TYPES[d.type].color)
    .transition().duration(300).attr('r', d => d.type === 'security_event' ? 12 : 9);

  nodeEnter.append('circle')
    .attr('class', 'ring pulse')
    .attr('fill', 'none')
    .attr('stroke', d => TYPES[d.type].color)
    .attr('stroke-width', 2)
    .attr('r', 8);

  nodeEnter.append('text')
    .attr('dy', 22)
    .text(d => TYPES[d.type].label);

  nodeLayer.selectAll('g.node').select('circle:first-child')
    .attr('fill', d => TYPES[d.type].color);
}

function ticked() {
  linkLayer.selectAll('line')
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeLayer.selectAll('g.node')
    .attr('transform', d => `translate(${d.x},${d.y})`);
}

function dragstart(event, d) { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
function dragend(event, d) { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }

function updateHud() {
  document.getElementById('nodeCount').textContent = nodes.length;
  document.getElementById('edgeCount').textContent = links.length;
  document.getElementById('eventCount').textContent = eventCounter;
}

function setRisk(score) {
  const el = document.getElementById('risk');
  el.textContent = score + ' / 100';
  el.className = score >= 70 ? 'high' : score >= 35 ? 'med' : 'low';
}

// seed graph
const user = addNode('user', width()*0.3, height()*0.5);
const agent = addNode('agent', width()*0.5, height()*0.5);
addLink(user, agent);
restart();

function simulateInteraction() {
  const prompt = addNode('prompt');
  addLink(agent, prompt);
  const tool = addNode('tool');
  addLink(prompt, tool);

  const branch = Math.random();
  let alertTriggered = false;
  if (branch < 0.35) {
    const mem = addNode('memory');
    addLink(tool, mem);
  } else if (branch < 0.7) {
    const db = addNode('database');
    addLink(tool, db);
  } else {
    const api = addNode('policy');
    addLink(tool, api);
  }

  const risk = Math.floor(Math.random() * 100);
  setRisk(risk);

  if (risk >= 78) {
    const sec = addNode('security_event');
    addLink(agent, sec, true);
    alertTriggered = true;
    eventCounter++;
  }

  pruneIfNeeded();
  restart();

  if (alertTriggered) {
    setTimeout(() => {
      linkLayer.selectAll('line.alert').classed('alert', true);
    }, 50);
  }
}

document.getElementById('simBtn').addEventListener('click', simulateInteraction);

let autoTimer = null;
document.getElementById('autoBtn').addEventListener('click', function() {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    this.classList.remove('active');
  } else {
    autoTimer = setInterval(simulateInteraction, 1400);
    this.classList.add('active');
  }
});

document.getElementById('resetBtn').addEventListener('click', function() {
  nodes = []; links = []; nodeCounter = 0; eventCounter = 0;
  const u = addNode('user', width()*0.3, height()*0.5);
  const a = addNode('agent', width()*0.5, height()*0.5);
  addLink(u, a);
  setRisk(0);
  restart();
});

// legend
const legend = d3.select('#legend');
Object.entries(TYPES).forEach(([key, val]) => {
  const item = legend.append('div').attr('class', 'item');
  item.append('div').attr('class', 'dot').style('background', val.color);
  item.append('span').text(val.label);
});

window.addEventListener('resize', () => {
  sim.force('center', d3.forceCenter(width()/2, height()/2));
  sim.alpha(0.3).restart();
});
</script>
</body>
</html>
